        localStorage.setItem('republica_dishes', JSON.stringify(dishes));
      }, [dishes]);

      useEffect(() => {
        lucide.createIcons();
      });

      // Cart Actions
      const addToCart = (dish, customization = null) => {
        const cartItemId = `${dish.id}-${Date.now()}`;
        const extrasTotal = customization?.extras?.reduce((sum, e) => sum + e.price, 0) || 0;
        const unitPrice = dish.price + extrasTotal;

        setCartItems(prev => [...prev, {
          cartItemId,
          name: dish.name,
          unitPrice,
          quantity: 1,
          image: dish.image,
          customization
        }]);
        setIsCartOpen(true);
      };

      const updateQty = (id, delta) => {
        setCartItems(prev => prev.map(item => {
          if (item.cartItemId === id) {
            const q = item.quantity + delta;
            return q > 0 ? { ...item, quantity: q } : null;
          }
          return item;
        }).filter(Boolean));
      };

      const cartSubtotal = cartItems.reduce((sum, item) => sum + (item.unitPrice * item.quantity), 0);
      const totalItemsCount = cartItems.reduce((sum, item) => sum + item.quantity, 0);

        if (!customerInfo.name || !customerInfo.phone || !customerInfo.address) {
          alert('Por favor preencha o seu Nome, Telefone e Endereço no Kilamba ou KK.');
          return;
        }

        msg += `👤 *Nome:* ${customerInfo.name}\n`;
        msg += `📲 *Telefone:* ${customerInfo.phone}\n`;
        msg += `📍 *Endereço (Kilamba/KK):* ${customerInfo.address}\n`;
        if (customerInfo.notes) msg += `📝 *Obs. Geral:* ${customerInfo.notes}\n`;

        msg += `\n*📋 ITENS DO PEDIDO:*\n`;
        cartItems.forEach((item, idx) => {
          msg += `\n*${idx + 1}. ${item.name}* (x${item.quantity})\n`;
          msg += `   Valor un.: ${item.unitPrice.toLocaleString('pt-AO')} Kz\n`;

                      <h4 className="font-bold text-[#FBC02D] uppercase">Dados de Entrega no Kilamba/KK</h4>
                      <input type="text" value={customerInfo.name} onChange={e => setCustomerInfo({...customerInfo, name: e.target.value})} placeholder="Nome Completo *" className="w-full bg-black border border-gray-800 p-2 rounded text-white" />
                      <input type="tel" value={customerInfo.phone} onChange={e => setCustomerInfo({...customerInfo, phone: e.target.value})} placeholder="Telefone WhatsApp *" className="w-full bg-black border border-gray-800 p-2 rounded text-white" />
                      <input type="text" value={customerInfo.address} onChange={e => setCustomerInfo({...customerInfo, address: e.target.value})} placeholder="Endereço no Kilamba/KK (Bloco, Edifício, Apt) *" className="w-full bg-black border border-gray-800 p-2 rounded text-white" />
                    </div>

                    <div className="pt-3 border-t border-gray-800 space-y-3">
                      <div className="flex justify-between font-bold text-sm">
                        <span>Total:</span>
                        <span className="text-[#FBC02D] text-lg">{cartSubtotal.toLocaleString('pt-AO')} Kz</span>
                      </div>
                      <button onClick={checkoutWhatsApp} className="w-full py-3 bg.emerald-600 bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs uppercase rounded-xl shadow">
                        Finalizar Encomenda no WhatsApp
                      </button>
                    </div>
                  </>
                ) : (
                  <p className="text-xs text-gray-500 text-center py-10">Carrinho vazio.</p>
                )}
              </div>
            </div>
          )}

          {/* ADMIN MODAL */}
          {isAdminOpen && (
            <div className="fixed inset-0 z-50 bg-black/85 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-[#121212] border border-gray-800 rounded-2xl max-w-2xl w-full p-6 space-y-4 max-h-[90vh] overflow-y-auto">
                <div className="flex justify-between items-center border-b border-gray-800 pb-3">
                  <h3 className="text-lg font-bold text-white font-heading">Painel Administrativo - República do Sabor</h3>
                  <button onClick={() => setIsAdminOpen(false)} className="text-gray-400 hover:text-white">✕</button>
                </div>

                {!isAdminAuth ? (
                  <form onSubmit={handleAdminLogin} className="space-y-3 max-w-xs mx-auto py-6">
                    <p className="text-xs text-gray-400 text-center">Autenticação de Direção</p>
                    <input type="text" value={adminUser} onChange={e => setAdminUser(e.target.value)} placeholder="Utilizador (admin)" className="w-full bg-[#1a1a1a] border border-gray-800 p-2 rounded text-xs text-white" />
                    <input type="password" value={adminPass} onChange={e => setAdminPass(e.target.value)} placeholder="Palavra-passe (sabor2026)" className="w-full bg-[#1a1a1a] border border-gray-800 p-2 rounded text-xs text-white" />
                    {adminError && <p className="text-[11px] text-red-400">{adminError}</p>}
                    <button type="submit" className="w-full py-2.5 bg-[#E52421] text-white text-xs font-bold uppercase rounded-lg">Entrar</button>
                  </form>
                ) : (
                  <form onSubmit={handleSaveDish} className="space-y-3 text-xs">
                    <h4 className="font-bold text-[#FBC02D] text-sm">{editingDishId ? 'Editar Prato' : 'Adicionar Novo Prato ao Menu'}</h4>
                    <div className="grid grid-cols-2 gap-2">
                      <input type="text" value={dishForm.name} onChange={e => setDishForm({...dishForm, name: e.target.value})} placeholder="Nome do Prato *" className="bg-[#1a1a1a] border border-gray-800 p-2 rounded text-white" required />
                      <select value={dishForm.categoryId} onChange={e => setDishForm({...dishForm, categoryId: e.target.value})} className="bg-[#1a1a1a] border border-gray-800 p-2 rounded text-white">
                        {categories.map(c => <option key={c.id} value={c.id}>{c.name}</option>)}
                      </select>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <input type="number" value={dishForm.price} onChange={e => setDishForm({...dishForm, price: e.target.value})} placeholder="Preço (Kz) *" className="bg-[#1a1a1a] border border-gray-800 p-2 rounded text-white" required />
                      <input type="text" value={dishForm.badge} onChange={e => setDishForm({...dishForm, badge: e.target.value})} placeholder="Badge Destaque (ex: Promoção)" className="bg-[#1a1a1a] border border-gray-800 p-2 rounded text-white" />
                    </div>
                    <input type="url" value={dishForm.image} onChange={e => setDishForm({...dishForm, image: e.target.value})} placeholder="URL da Imagem *" className="w-full bg-[#1a1a1a] border border-gray-800 p-2 rounded text-white" required />
                    <textarea value={dishForm.description} onChange={e => setDishForm({...dishForm, description: e.target.value})} placeholder="Descrição do Prato" rows="2" className="w-full bg-[#1a1a1a] border border-gray-800 p-2 rounded text-white" />
                    <div className="flex justify-end gap-2 pt-2">
                      <button type="submit" className="px-6 py-2 bg-[#E52421] text-white font-bold rounded-lg uppercase">Guardar no Website</button>
                    </div>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
